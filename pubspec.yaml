name: mochila_market
description: "MochilaMarket — inventario de mochilas, tienda pública, publicaciones (grupos de ofertas), plantilla Marketplace, fotos e IA externa."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  image_picker: ^1.2.3
  camera: ^0.11.1
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  bcrypt: ^1.2.0
  crypto: ^3.0.7
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
